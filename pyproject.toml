[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloom-agents-multimedia"
version = "0.1.0"
description = "Autonomous multimedia knowledge ingestion and distillation agent for the AgentLoom framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dr. Boyuan (Keven) Guan" }
]
keywords = ["agentloom", "ai-agent", "multimedia", "transcription", "asr", "knowledge-distillation", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.2",
    "openai>=1.20.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "imageio-ffmpeg>=0.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
local-asr = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
agentloom-media = "agentloom_media.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
